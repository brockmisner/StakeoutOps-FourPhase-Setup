<!doctype html><html lang="en"><meta charset="utf-8"><title>Temporary layout verification</title><style>body{margin:16px;background:#cfd6df;font:14px system-ui}header{margin-bottom:12px;display:flex;gap:12px;align-items:center}select{padding:8px}iframe{display:block;border:0;background:white;transform-origin:top left}main{width:max-content}</style><header><strong>Layout verification</strong><label>Viewport <select id="size"><option value="390x844">390 × 844 mobile</option><option value="768x1024">768 × 1024 tablet</option><option value="1469x1072">1469 × 1072 concept</option></select></label></header><main><iframe title="Dashboard responsive preview" src="/" width="390" height="844"></iframe></main><script>const frame=document.querySelector('iframe');document.querySelector('select').onchange=e=>{const [w,h]=e.target.value.split('x').map(Number);frame.width=w;frame.height=h;frame.style.transform=w>innerWidth-32?'scale('+((innerWidth-32)/w)+')':'';};</script></html>
